<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Project - Sayan's Electronics Lab</title>

    <link rel="stylesheet"
          href="project-details.css">

</head>

<body>

    <main class="details-page">

        <button class="back-button"
                onclick="goBack()">
            ← Back to Projects
        </button>


        <section class="project-details">

            <h1 id="projectName">
                Project Name
            </h1>


            <div class="project-options">

                <a id="pdfLink"
                   class="project-option"
                   href="#"
                   target="_blank">

                    <span>📄</span>
                    <span>Project PDF</span>

                </a>


                <a id="imagesLink"
                   class="project-option"
                   href="#"
                   target="_blank">

                    <span>🖼️</span>
                    <span>Project Images</span>

                </a>


                <a id="githubLink"
                   class="project-option"
                   href="#"
                   target="_blank">

                    <span>💻</span>
                    <span>Source Code</span>

                </a>


                <a id="videoLink"
                   class="project-option"
                   href="#"
                   target="_blank">

                    <span>🎥</span>
                    <span>Project Video</span>

                </a>

            </div>

        </section>

    </main>


    <script src="project-details.js"></script>

</body>

</html>
